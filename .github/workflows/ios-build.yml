name: iOS clean-clone build

on:
  push:
    branches:
      - phuong-an-tich-hop-ios
  pull_request:
    branches:
      - iosv1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bundled models
        run: ./tools/verify_ios_assets.sh

      - name: Install locked CocoaPods
        run: sudo gem install cocoapods --version 1.16.2 --no-document

      - name: Restore CocoaPods
        working-directory: myposecoach1
        run: pod _1.16.2_ install

      - name: Save generated Podfile.lock
        uses: actions/upload-artifact@v4
        with:
          name: Podfile-lock
          path: myposecoach1/Podfile.lock

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -workspace myposecoach1/myposecoach1.xcworkspace
          -scheme myposecoach1

      - name: Build
        run: >-
          xcodebuild build
          -workspace myposecoach1/myposecoach1.xcworkspace
          -scheme myposecoach1
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
