name: iOS clean-clone build

on:
  push:
    branches:
      - phuong-an-tich-hop-ios
  pull_request:
    branches:
      - iosv1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run the same clean build command as a new clone
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
        run: ./build-ios.sh

      - name: Verify lockfiles stay unchanged
        run: git diff --exit-code -- myposecoach1/Podfile.lock myposecoach1/myposecoach1.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved myposecoach1/myposecoach1.xcworkspace/xcshareddata/swiftpm/Package.resolved
